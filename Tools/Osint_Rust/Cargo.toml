[package]
name = "osint_v2_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
hex = "0.4.3"
indicatif = "0.18.6"
phonenumber = "0.3.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "gzip", "query", "form", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
webbrowser = "1.2.5"
which = "8.0.6"

[profile.release]
opt-level = 3
lto = true
strip = true
